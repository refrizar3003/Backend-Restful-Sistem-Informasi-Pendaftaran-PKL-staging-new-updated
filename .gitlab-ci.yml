stages:
  - build
  - deploy

variables:
  REGISTRY_IMAGE: registry.gitlab.com/internship-telkom-system/backend

# ─── BUILD ───────────────────────────────────────────────
build:staging:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_TOKEN registry.gitlab.com
  script:
    - docker build -t $REGISTRY_IMAGE:staging -t $REGISTRY_IMAGE:staging-$CI_COMMIT_SHORT_SHA .
    - docker push $REGISTRY_IMAGE:staging
    - docker push $REGISTRY_IMAGE:staging-$CI_COMMIT_SHORT_SHA

# ─── DEPLOY ──────────────────────────────────────────────
deploy:staging:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY_STAGING" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan $VPS_IP_STAGING >> ~/.ssh/known_hosts
  script:
    - scp docker-compose.yml azureuser@$VPS_IP_STAGING:/opt/app/backend/docker-compose.yml
    - ssh azureuser@$VPS_IP_STAGING "docker login registry.gitlab.com -u $CI_REGISTRY_USER -p $CI_REGISTRY_TOKEN"
    - |
      ssh azureuser@$VPS_IP_STAGING bash << 'EOF'
        cd /opt/app/backend
        docker compose pull app
        docker compose up -d --no-deps app
        docker image prune -f
      EOF
